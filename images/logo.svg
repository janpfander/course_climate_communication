<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 200" role="img" aria-label="Course hex logo: speech bubble with warming stripes">
  <!-- Hexagon (MetBrewer Navajo palette) -->
  <polygon points="87,2 170,50 170,150 87,198 4,150 4,50"
           fill="#fdf8ec" stroke="#660d20" stroke-width="7" stroke-linejoin="round"/>
  <!-- Speech bubble -->
  <path d="M 54 42 H 120 A 12 12 0 0 1 132 54 V 90 A 12 12 0 0 1 120 102 H 84 L 56 120 L 64 102 H 54 A 12 12 0 0 1 42 90 V 54 A 12 12 0 0 1 54 42 Z"
        fill="#ffffff" stroke="#094568" stroke-width="4" stroke-linejoin="round"/>
  <!-- Warming stripes, cold to hot -->
  <rect x="50"  y="50" width="13.5" height="44" rx="2" fill="#094568"/>
  <rect x="65"  y="50" width="13.5" height="44" rx="2" fill="#e1c59a"/>
  <rect x="80"  y="50" width="13.5" height="44" rx="2" fill="#edce79"/>
  <rect x="95"  y="50" width="13.5" height="44" rx="2" fill="#e59a52"/>
  <rect x="110" y="50" width="13.5" height="44" rx="2" fill="#660d20"/>
  <!-- Wordmark -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#094568">
    <text x="87" y="144" font-size="19" font-weight="700">Climate</text>
    <text x="87" y="163" font-size="15" font-weight="700" textLength="104" lengthAdjust="spacingAndGlyphs">Communication</text>
    <text x="87" y="177" font-size="7.5" font-weight="600" fill="#660d20">ETH Zurich · 2026</text>
  </g>
</svg>
