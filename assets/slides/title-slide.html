<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <img class="title-logo title-logo-eawag" src="../images/eawag_logo.svg" alt="Eawag">
  <img class="title-logo title-logo-course" src="../images/logo.svg" alt="Course logo">
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
$for(author)$
  <p class="author">$author$</p>
$endfor$
$if(date)$
  <p class="date">$date$</p>
$endif$
</section>
